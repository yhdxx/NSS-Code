# myCodingAgent 运行配置示例。
# 可复制为 Agent 安装目录 `.mycodingagent/config.yaml`，也可复制为
# `~/.config/myCodingAgent/config.yaml` 作为当前用户所有安装共用的配置。
# 加载优先级：内置默认值 < 用户配置 < 安装目录配置 < 可选工作区配置 < MYCODINGAGENT_CONFIG < 环境变量。
# 工作区配置仅在设置环境变量 `MYCODINGAGENT_LOAD_WORKSPACE_CONFIG=1` 后加载。

api:
  # 环境变量：DEEPSEEK_API_KEY
  # 建议通过环境变量保存密钥，避免把密钥写入仓库。
  # deepseek_api_key: ""
  # 环境变量：DEEPSEEK_BASE_URL
  base_url: "https://api.deepseek.com"
  # 环境变量：DEEPSEEK_MODEL
  model: "deepseek-v4-pro"

embedding:
  # 环境变量：MYCODINGAGENT_EMBEDDING_PROVIDER
  # 支持值：bge_http/http/ollama/openai_compatible/dashscope、local/bge、hash。
  provider: "bge_http"
  # 环境变量：MYCODINGAGENT_EMBEDDING_MODEL；旧兼容变量：MYCODINGAGENT_BGE_MODEL
  model: "bge-m3"
  # 环境变量：MYCODINGAGENT_EMBEDDING_ENDPOINT；旧兼容变量：MYCODINGAGENT_BGE_ENDPOINT
  endpoint: "http://127.0.0.1:11434/api/embed"
  # 环境变量：MYCODINGAGENT_EMBEDDING_API_FORMAT；旧兼容变量：MYCODINGAGENT_BGE_API_FORMAT
  # 支持值：ollama、openai、dashscope。
  api_format: "ollama"
  # 环境变量：MYCODINGAGENT_EMBEDDING_API_KEY；旧兼容变量：MYCODINGAGENT_BGE_API_KEY
  # api_key: ""
  # 环境变量：MYCODINGAGENT_EMBEDDING_TIMEOUT；旧兼容变量：MYCODINGAGENT_BGE_TIMEOUT
  timeout: 30.0
  # 环境变量：MYCODINGAGENT_EMBEDDING_DIM；旧兼容变量：MYCODINGAGENT_BGE_DIM
  dimension: 512
  # 环境变量：MYCODINGAGENT_EMBEDDING_QUERY_INSTRUCTION；旧兼容变量：MYCODINGAGENT_BGE_QUERY_INSTRUCTION
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  # 环境变量：MYCODINGAGENT_EMBEDDING_DEVICE；旧兼容变量：MYCODINGAGENT_BGE_DEVICE
  # device: "cpu"
  # 环境变量：MYCODINGAGENT_EMBEDDING_BATCH_SIZE；旧兼容变量：MYCODINGAGENT_BGE_BATCH_SIZE
  batch_size: 16
  # 环境变量：MYCODINGAGENT_EMBEDDING_FALLBACK_TO_HASH；旧兼容变量：MYCODINGAGENT_BGE_FALLBACK_TO_HASH
  fallback_to_hash: false
  # 环境变量：MYCODINGAGENT_HASH_EMBEDDING_DIM
  hash_dimension: 256
  # 环境变量：MYCODINGAGENT_EMBEDDING_REQUEST_EXTRA
  # request_extra:
  #   dimensions: 1024
  # 环境变量：MYCODINGAGENT_EMBEDDING_HEADERS
  # headers:
  #   X-Custom-Header: "value"

  # 示例：DashScope / 通义千问的 OpenAI 兼容 Embedding 接口。
  # provider: "openai_compatible"
  # api_format: "openai"
  # endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings"
  # model: "text-embedding-v4"
  # dimension: 1536
  # 密钥放入环境变量 `MYCODINGAGENT_EMBEDDING_API_KEY`。

  # 示例：DashScope 原生 Embedding 接口。
  # provider: "dashscope"
  # api_format: "dashscope"
  # endpoint: "https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding"
  # model: "text-embedding-v4"

  # 示例：本地 sentence-transformers 模型。
  # provider: "local"
  # model: "/absolute/path/to/local/bge-m3"
  # device: "cpu"

milvus:
  # 环境变量：MYCODINGAGENT_MILVUS_ENABLED
  enabled: true
  # 环境变量：MYCODINGAGENT_MILVUS_HOST
  host: "127.0.0.1"
  # 环境变量：MYCODINGAGENT_MILVUS_PORT
  port: "19530"
  # 环境变量：MYCODINGAGENT_MILVUS_URI
  # uri: "http://127.0.0.1:19530"
  # 环境变量：MYCODINGAGENT_MILVUS_COLLECTION
  collection: "mycodingagent_skills"
  # 环境变量：MYCODINGAGENT_MILVUS_TOKEN
  # token: ""
  # 环境变量：MYCODINGAGENT_MILVUS_RECREATE_INCOMPATIBLE
  recreate_incompatible: true
  # 环境变量：MYCODINGAGENT_MILVUS_DENSE_INDEX_TYPE
  dense_index_type: "HNSW"
  # 环境变量：MYCODINGAGENT_MILVUS_DENSE_METRIC_TYPE
  dense_metric_type: "COSINE"
  # 环境变量：MYCODINGAGENT_MILVUS_HNSW_M
  hnsw_m: 16
  # 环境变量：MYCODINGAGENT_MILVUS_HNSW_EF_CONSTRUCTION
  hnsw_ef_construction: 256
  # 环境变量：MYCODINGAGENT_MILVUS_HNSW_EF
  hnsw_ef: 64
  # 环境变量：MYCODINGAGENT_MILVUS_SPARSE_INDEX_TYPE
  sparse_index_type: "SPARSE_INVERTED_INDEX"
  # 环境变量：MYCODINGAGENT_MILVUS_SPARSE_METRIC_TYPE
  sparse_metric_type: "BM25"
  # 环境变量：MYCODINGAGENT_MILVUS_SPARSE_ALGO
  sparse_inverted_index_algo: "DAAT_MAXSCORE"
  # 环境变量：MYCODINGAGENT_MILVUS_RRF_K
  rrf_k: 60
  # 环境变量：MYCODINGAGENT_MILVUS_TEXT_MAX_BYTES
  text_max_bytes: 65535
  # 环境变量：MYCODINGAGENT_MILVUS_ANALYZER_PARAMS
  analyzer_params:
    type: "chinese"

docker:
  # 环境变量：MYCODINGAGENT_DOCKER_IMAGE
  image: "mycodingagent-sandbox:py312"
  # 环境变量：MYCODINGAGENT_DOCKER_NETWORK
  network: "none"
  # 环境变量：MYCODINGAGENT_DOCKER_BUILD_NETWORK
  build_network: "host"
  # 环境变量：MYCODINGAGENT_DOCKER_CPUS
  cpus: "2"
  # 环境变量：MYCODINGAGENT_DOCKER_MEMORY
  memory: "1g"
  # 环境变量：MYCODINGAGENT_DOCKER_PIDS_LIMIT
  pids_limit: "256"
  # 环境变量：MYCODINGAGENT_DOCKER_DEFAULT_TIMEOUT
  default_timeout: 120
  # 环境变量：MYCODINGAGENT_DOCKER_MAX_TIMEOUT
  max_timeout: 600

mcp:
  # 环境变量：MYCODINGAGENT_MCP_ENABLED
  enabled: true
  # 环境变量：MYCODINGAGENT_MCP_PROJECT_CONFIG
  project_config_path: ".mycodingagent/mcp.json"
  # 环境变量：MYCODINGAGENT_MCP_USER_CONFIG
  user_config_path: "~/.config/myCodingAgent/mcp.json"

skills:
  # 环境变量：MYCODINGAGENT_SKILL_INDEX_DIR
  # index_dir: ".mycodingagent/skill_runtime"
  # 环境变量：MYCODINGAGENT_DEFAULT_SKILLS
  default_tool_names:
    - "coding-standards"
  # 环境变量：MYCODINGAGENT_SKILL_VECTOR_SYNC_BATCH_SIZE
  vector_sync_batch_size: 2
  # 环境变量：MYCODINGAGENT_SKILL_VECTOR_SYNC_MAX_RETRIES
  vector_sync_max_retries: 3
